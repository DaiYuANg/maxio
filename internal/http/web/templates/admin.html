<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}}</title>
<style>
:root{--ink:#1b1915;--muted:#716b5e;--line:#ddd3c1;--paper:#f7f0df;--card:#fffaf0;--rust:#a44725;--olive:#56613b;--blue:#24495d;--good:#20754d;--bad:#a32626}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 8%,#ffe6b4,transparent 26rem),linear-gradient(135deg,#f9f0dc,#e8ddc4);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
button,input,textarea{font:inherit}button{border:0;border-radius:999px;background:var(--ink);color:#fff;padding:.65rem 1rem;cursor:pointer}button.secondary{background:var(--olive)}button.danger{background:var(--bad)}
header{padding:3rem clamp(1rem,5vw,5rem) 2rem;display:grid;grid-template-columns:1.3fr .7fr;gap:2rem;align-items:end}
h1{font-size:clamp(2.8rem,8vw,7rem);line-height:.86;margin:0;letter-spacing:-.08em}header p{max-width:40rem;color:var(--muted);font-size:1.05rem}
main{padding:0 clamp(1rem,5vw,5rem) 4rem;display:grid;grid-template-columns:1fr 1fr;gap:1rem}.card{background:color-mix(in srgb,var(--card) 88%,white);border:1px solid var(--line);border-radius:1.4rem;padding:1rem;box-shadow:0 20px 60px #6a4b241a}
.wide{grid-column:1/-1}.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.top{display:flex;justify-content:space-between;gap:1rem;align-items:center}.pill{border:1px solid var(--line);border-radius:999px;padding:.35rem .65rem;background:#fff7e7;color:var(--muted)}
h2{margin:.2rem 0 1rem;font-size:1.35rem}label{display:grid;gap:.3rem;color:var(--muted);font-size:.86rem}input,textarea{width:100%;border:1px solid var(--line);border-radius:.8rem;background:#fffaf0;padding:.65rem;color:var(--ink)}
textarea{min-height:8rem;font-family:"Lucida Console",monospace;font-size:.82rem}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;border-bottom:1px solid var(--line);padding:.55rem;vertical-align:top}th{color:var(--muted);font-weight:400}
.ok{color:var(--good)}.err{color:var(--bad)}pre{white-space:pre-wrap;background:#201c17;color:#f9efd8;border-radius:1rem;padding:1rem;max-height:18rem;overflow:auto}.mono{font-family:"Lucida Console",monospace;font-size:.82rem}
@media(max-width:850px){header,main,.split{grid-template-columns:1fr}h1{letter-spacing:-.06em}
}
</style>
</head>
<body>
<header><div><p class="pill">{{.Product}} admin console</p><h1>Runtime<br>Console</h1></div><p>Inspect object metadata, readiness, and operational helpers for the running gateway.</p></header>
<main>
<section class="card"><div class="top"><h2>Runtime</h2><button onclick="refreshAll()">Refresh</button></div><div class="row"><span class="pill">health: <b id="health">unknown</b></span><span class="pill">buckets: <b id="bucketCount">0</b></span></div></section>
<section class="card"><h2>Buckets</h2><div class="top"><button class="secondary" onclick="loadBuckets()">Reload</button></div><table><tbody id="buckets"></tbody></table></section>
<section class="card"><h2>Objects</h2><div class="split"><label>Bucket<input id="objectBucket"></label><label>Prefix<input id="objectPrefix"></label></div><p><button onclick="loadObjects()">List objects</button></p><table><thead><tr><th>Key</th><th>Size</th><th>Hash</th></tr></thead><tbody id="objects"></tbody></table></section>
<section class="card wide"><h2>Search</h2><div class="split"><label>Bucket<input id="searchBucket"></label><label>Prefix<input id="searchPrefix"></label></div><p><button onclick="searchObjects()">Search metadata</button></p><pre id="searchResult">{}</pre></section>
<section class="card wide"><h2>Activity</h2><pre id="log">ready</pre></section>
</main>
<script>
const $ = id => document.getElementById(id);
const log = (m, o) => { $("log").textContent = new Date().toLocaleTimeString() + " " + m + (o ? "\n" + JSON.stringify(o, null, 2) : "") + "\n\n" + $("log").textContent; };

async function api(path, opt) {
  const r = await fetch(path, opt);
  const text = await r.text();
  let data = text ? JSON.parse(text) : null;
  if (!r.ok) {
    throw new Error((data && data.error) || text || r.statusText);
  }
  return data;
}

async function loadHealth() {
  try {
    const h = await api("/healthz");
    $("health").textContent = h.status;
    $("health").className = "ok";
  } catch (e) {
    $("health").textContent = "down";
    $("health").className = "err";
    log("health failed", String(e));
  }
}

async function loadBuckets() {
  const items = await api("/");
  $("bucketCount").textContent = items.length;
  $("buckets").innerHTML = items.map((b) => '<tr><td><button class="secondary" onclick="pickBucket(\'' + b.name + '\')">' + b.name + '</button></td><td>' + (b.created_at || "") + '</td></tr>').join("") || "<tr><td>empty</td></tr>";
}

function pickBucket(name) {
  $("objectBucket").value = name;
  $("searchBucket").value = name;
  loadObjects();
}

async function loadObjects() {
  const bucket = $("objectBucket").value;
  if (!bucket) return;
  const prefix = encodeURIComponent($("objectPrefix").value);
  const items = await api(`/${bucket}?prefix=${prefix}`);
  $("objects").innerHTML = items.map((o) => '<tr><td>' + o.key + '</td><td>' + o.size + '</td><td class="mono">' + o.hash + '</td></tr>').join("") || "<tr><td colspan=3>empty</td></tr>";
}

async function searchObjects() {
  const q = { bucket: $("searchBucket").value, prefix: $("searchPrefix").value };
  $("searchResult").textContent = JSON.stringify(await api("/_search", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(q),
  }), null, 2);
}

async function refreshAll() {
  try {
    await Promise.all([loadHealth(), loadBuckets()]);
  } catch (e) {
    log("refresh failed", String(e));
  }
}

refreshAll();
</script>
</body>
</html>
