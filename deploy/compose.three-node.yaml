services:
  maxio-1:
    build:
      context: ..
      dockerfile: Dockerfile
    image: maxio:dev
    environment:
      MAXIO_HTTP_ADDRESS: ":8080"
      MAXIO_STORAGE_ADDRESS: "maxio-1:8080"
      MAXIO_DATA_DIR: "/app/data"
      MAXIO_ADMIN_TOKEN: "${MAXIO_ADMIN_TOKEN:-dev-admin-token}"
    ports:
      - "8081:8080"
    volumes:
      - maxio-1-data:/app/data

  maxio-2:
    image: maxio:dev
    depends_on:
      - maxio-1
    environment:
      MAXIO_HTTP_ADDRESS: ":8080"
      MAXIO_STORAGE_ADDRESS: "maxio-2:8080"
      MAXIO_DATA_DIR: "/app/data"
      MAXIO_ADMIN_TOKEN: "${MAXIO_ADMIN_TOKEN:-dev-admin-token}"
    ports:
      - "8082:8080"
    volumes:
      - maxio-2-data:/app/data

  maxio-3:
    image: maxio:dev
    depends_on:
      - maxio-1
    environment:
      MAXIO_HTTP_ADDRESS: ":8080"
      MAXIO_STORAGE_ADDRESS: "maxio-3:8080"
      MAXIO_DATA_DIR: "/app/data"
      MAXIO_ADMIN_TOKEN: "${MAXIO_ADMIN_TOKEN:-dev-admin-token}"
    ports:
      - "8083:8080"
    volumes:
      - maxio-3-data:/app/data

volumes:
  maxio-1-data:
  maxio-2-data:
  maxio-3-data:
